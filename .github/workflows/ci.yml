name: MoonBit core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit stable
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch declared dependencies
        run: moon update
      # `moon fmt --check` is deliberately absent. The canonical spelling of the
      # integer type and of optional arguments changed between moonc 0.10.14
      # (`Int`, `options?`) and 0.10.17 (`Int32`, `options~`). Both spellings
      # compile on 0.10.17, but a formatting gate here would force the newer
      # spelling, which the 0.10.14 floor named by the contest does not accept.
      - name: Check, build and test
        run: |
          moon version --all
          moon check --deny-warn --target all
          moon build --target all
          moon test --deny-warn --target all
      # The generated interface is compared after normalising `Int32` to `Int`,
      # the spelling moonc 0.10.14 prints for the same 32-bit integer type, so
      # the gate still catches real API drift on either toolchain.
      - name: Public interface is current
        run: |
          moon info
          sed -i 's/\bInt32\b/Int/g' pkg.generated.mbti examples/demo/pkg.generated.mbti
          git diff --exit-code -- pkg.generated.mbti examples/demo/pkg.generated.mbti
      - name: Exercise public API
        run: |
          for target in wasm wasm-gc js native; do
            moon run examples/demo --target "$target"
          done
